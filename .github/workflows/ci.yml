# Cadence CI — ACTIVE. Actions is enabled on this repository and every job below has been running
# on push/PR to `main` since 2026-08-31. Confirmed 2026-09-04 via
# `gh api repos/WilliamWeihaoran/cadence/actions/permissions` (`enabled: true`) and the workflow's
# own run history: 22 runs, all green except the bootstrapping run before this file settled
# (33355551830, fixed the same day in 33356061476). "Build CadenceMCPServer (macOS)" specifically
# has passed on every run since — this file, not a local one-off build, is what keeps that target's
# drift visible now (T-852). The paragraph below calling it a "PROPOSAL" is what an outside audit
# read to conclude "nothing runs" (T-852); it was true when this file was added and is stale now.
# Do not re-derive that conclusion from this comment alone — check the run history.
#
# Why this file exists
# --------------------
# Every verification in this project runs through one coordinator, serially, on one Mac. One
# integration pass is ~9 minutes of wall clock that nothing else can overlap. Two things follow:
#
#  1. Serialisation. A batch of agents queues behind one machine and one test-host mutex.
#  2. Blind spots that `-scheme Cadence` cannot see. `CadenceMCPServer` is a command-line target
#     with an EXPLICIT Sources phase (see CadenceMCPServer/AGENTS.md): app-side edits to
#     Cadence/Models or Cadence/Services routinely break it while the app scheme stays green.
#     Measured precedent in this repository's own history: the MCP target did not compile for four
#     consecutive commits (aaa0064 through bc13be0, fixed in 45a8084) with `-scheme Cadence` green
#     the whole way; 670e299 and 62dc384 are two more. Building that scheme on every push is the
#     "honest close" docs/TODO.md T-435 names for itself.
#
# What this deliberately does NOT do
# ----------------------------------
#  * CadenceUITests. T-531: macOS UI testing needs a one-time system authorisation granted with the
#    user's password at a GUI prompt. A hosted runner has nobody to grant it, so the stage would
#    fail at launch on every run, not intermittently. It stays local-only until T-531 is resolved.
#  * Anything signed with a real identity. A hosted runner has no keychain identity and no
#    provisioning profile for this app's entitlements (iCloud container, app group, Sign in with
#    Apple, APS), so the shipping entitlements cannot be used there.
#
#    Measured locally 2026-08-31, and the obvious spelling is WRONG:
#      - CODE_SIGNING_ALLOWED=NO builds fine (911 Swift compiles, 0 errors, `** TEST BUILD
#        SUCCEEDED **`, products `adhoc, linker-signed`, `TeamIdentifier=not set`) but its test
#        host HANGS: "Cadence (43764) encountered an error (The test runner hung before
#        establishing connection.)" after 369 s. An unentitled linker-signed binary cannot be
#        attached to, and XCTest injection needs that.
#      - CODE_SIGN_IDENTITY="-" with .github/ci.entitlements (get-task-allow, nothing else) WORKS:
#        11 tests executed, exit 0. That is what every job below uses.
#    Under XCTest the app never opens the app-group or CloudKit store — PersistenceController
#    .isRunningTests routes it to a local temp store — so nothing else in the shipping
#    entitlements is needed by the unit suite.
#  * Archive / notarise / release. Out of scope; those need the real identity.
#
# Cost, stated plainly
# --------------------
# GitHub-hosted macOS runners are NOT free on a private repository. They bill at a 10x multiplier
# against included minutes (publicly listed around $0.08/min for the standard 3-core arm64 image —
# re-check current pricing before enabling). This repository is private as of writing.
#
#   * Local full pass on the user's M3 Pro (11 cores): ~526 s.
#   * A hosted standard macOS runner is a 3-core M1. Expect roughly 2-3x, i.e. 20-30 min for the
#     test job, ~2 min for the MCP job, ~6-10 min for the optional iOS job.
#   * So one full CI pass is roughly 25-40 macOS runner-minutes ≈ $2-$3 per push, or about 5-8
#     pushes on a plan's included 200-300 macOS minutes.
#
# That is why `paths-ignore` below is load-bearing rather than tidy: it skips commits that touch
# only docs/**, AGENTS.md, CLAUDE.md or README.md, and no doc change can break a build.
#
# THE RATE IS NOT A CONSTANT, AND THE OLD ONE HAD ROTTED (T-985, re-measured 2026-09-12 at
# `45c17d6`). This paragraph used to read "106 of this repository's last 120 commits ... an ~88%
# reduction in billed minutes". Re-measured over the last 120 commits at that revision: **43**, i.e.
# about 36%. It was true when written, during a docs-heavy stretch. It is a sample of whatever the
# repository happened to be doing that week, not a property of the filter -- it moved by one inside
# the single session that re-measured it -- so re-run it before quoting it in a cost argument.
#
# The steadier reason to keep the filter, which does not slide with the work mix: **308 of the 430
# commits that have ever touched docs/TODO.md touch nothing else this workflow would compile.** The
# ticket ledger is the single most-edited file in the repository -- 430 commits against 70 for the
# runner-up -- and every edit to it is, by construction, a no-op for every job below.
# As of 2026-09-04 all three jobs are enabled and running (see the header); the cost was accepted,
# not avoided. If it ever needs trimming again, `mcp-server` is the one job to keep no matter what:
# it is the one gate that catches something the local loop structurally cannot.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
  workflow_dispatch:
    inputs:
      run_ios:
        description: 'Also compile the iOS surface (T-535). Costs ~6-10 extra runner minutes.'
        type: boolean
        default: false
        # T-1080 (2026-09-06): this input is now only a way to FORCE the iOS job on a manual
        # run with everything else. Since T-707 was decided the job also runs on every push and
        # pull request that survives `paths-ignore` above, so leaving this false no longer means
        # "no iOS build" -- it means "no iOS build on THIS dispatch". The description above
        # predates that and its ~6-10 minute figure is wrong; see the ios-build job's comment.

# Superseded pushes are cancelled rather than billed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # The gate the local loop structurally cannot provide. Cheapest job here; if
  # only one job is ever enabled, make it this one.
  # ---------------------------------------------------------------------------
  mcp-server:
    name: Build CadenceMCPServer (macOS)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Assert toolchain
        run: ./.github/scripts/assert-toolchain.sh
      - name: Build
        run: |
          # scripts/xcb.sh writes its log to "${TMPDIR}cadence-xcb-<id>.log". Pin TMPDIR here (NOT
          # in a job-level `env:` -- the `runner` context is not legal there and evaluates empty)
          # so the Gates step below knows the path without parsing it back out of stdout.
          export TMPDIR="$RUNNER_TEMP/"
          ./scripts/xcb.sh ci-mcp build \
            -scheme CadenceMCPServer \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-mcp" \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_ENTITLEMENTS=.github/ci.entitlements
      - name: Gates
        if: always()
        run: ./.github/scripts/check-log.sh "$RUNNER_TEMP/cadence-xcb-ci-mcp.log" build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mcp-build-log
          path: ${{ runner.temp }}/cadence-xcb-ci-mcp.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # The unit suite. Scoped to CadenceTests: an unscoped run pulls in
  # CadenceUITests, which cannot launch here (T-531).
  # ---------------------------------------------------------------------------
  macos-tests:
    name: CadenceTests (macOS)
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Assert toolchain
        run: ./.github/scripts/assert-toolchain.sh
      - name: Test
        run: |
          export TMPDIR="$RUNNER_TEMP/"
          ./scripts/xcb.sh ci-tests test \
            -scheme Cadence \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-tests" \
            -only-testing:CadenceTests \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_ENTITLEMENTS=.github/ci.entitlements
      - name: Gates
        if: always()
        run: ./.github/scripts/check-log.sh "$RUNNER_TEMP/cadence-xcb-ci-tests.log" test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-log
          path: ${{ runner.temp }}/cadence-xcb-ci-tests.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcresult
          path: ${{ runner.temp }}/dd-tests/Logs/Test/*.xcresult
          if-no-files-found: ignore
      # T-977: scripts/real-tree-sweep-manifest.sh selftest -- the proof that a stale manifest
      # still regenerates a non-empty body (T-873) -- had no caller anywhere: not this workflow,
      # not xcb.sh's own preflight, and not CadenceTests itself. The reason first given for that
      # last one was wrong and is corrected here (T-959, measured 2026-09-12): the test host CAN
      # spawn Xcode's own `xcodebuild` (exit 0) and CAN spawn `pgrep`; only the setuid `ps` is
      # refused. What stops an in-host run is that the host may write nothing outside its own
      # container -- not `/tmp`, and not the checkout it is testing -- so it cannot lay down the
      # stale tree this selftest regenerates from. That is unmeasured end to end (T-1151). A
      # hosted runner is not sandboxed at all, so this is the one place that CAN run it. Reuses
      # the derived data and signing overrides the Test step above already built, so this is
      # close to free rather than a second full compile.
      - name: Real-tree sweep manifest selftest
        run: |
          export TMPDIR="$RUNNER_TEMP/"
          ./scripts/real-tree-sweep-manifest.sh ci-sweep-selftest selftest \
            -derivedDataPath "$RUNNER_TEMP/dd-tests" \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_ENTITLEMENTS=.github/ci.entitlements
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sweep-manifest-selftest-log
          path: ${{ runner.temp }}/cadence-xcb-ci-sweep-selftest.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # T-535: nothing in the release gate ever compiles the iOS surface, and
  # Cadence/iOS is a large real surface, not a stub. Manual-only, deliberately:
  # it is ~6-10 billed runner-minutes and most changes here are macOS-only.
  #
  # If it should instead run automatically on pushes that touch Cadence/iOS, that
  # needs a cheap ubuntu `changes` job emitting an output that this job's `if:`
  # reads -- a per-job `paths:` filter does not exist, and doing it with a
  # third-party paths-filter action would add supply-chain surface for one
  # boolean. Left as a decision rather than guessed at.
  # ---------------------------------------------------------------------------
  #
  # DECIDED 2026-09-06 (T-1080, closing T-707's open question). The job now also runs on every
  # push and pull request that survives `paths-ignore`. The `changes`-job filter sketched above
  # was measured and rejected, not skipped:
  #
  #   * It buys less than it looks like. Over this repository's last 120 commits, 74 survive
  #     `paths-ignore` and would start CI at all -- and 46 of those 74 (62%) touch a path the
  #     iOS build compiles. Only 20 of 74 touch `Cadence/iOS/` itself, but filtering on that
  #     narrow set would be WRONG and would rebuild exactly the hole T-535 was filed for: 100 of
  #     the 105 files under Cadence/iOS sit behind platform fences, so what breaks the iOS tree
  #     is routinely an edit to Cadence/Shared, Cadence/Models or Cadence/Services that macOS
  #     compiles happily. The honest filter is the broad one, and it skips 38% of runs.
  #   * The thing it was meant to save is much smaller than this file assumed. Measured
  #     2026-09-06, cold, in a `git archive HEAD` tree with a private derivedDataPath on the
  #     user's M3 Pro: `-destination 'generic/platform=iOS Simulator' build` took **53 seconds**
  #     (1410 Swift compile tasks, BUILD SUCCEEDED, 0 errors, 0 warnings). The ~6-10 minute
  #     estimate above was reasoned, never measured. Applying this file's own measured hosted
  #     multiplier (local full pass 526 s -> 20-30 hosted min, i.e. 2.3-3.4x) puts the compile
  #     near 2-3 min; call it 4-6 min with checkout, toolchain assert and a cold SourcePackages
  #     resolve. So the filter would save roughly 38% of a 4-6 minute job, not of a 10 minute one.
  #   * Its failure mode is the one this project keeps getting bitten by. A path glob that stops
  #     matching does not go red; it goes QUIET, and the gate reports success having compiled
  #     nothing. That is the same shape as T-535 (a green release gate that never built iOS) and
  #     as the `CADENCE_RUN_INTERACTIVE_UI_TESTS` gate that skipped silently for weeks because
  #     no channel could set it. Trading a measured 38% of a cheap job for a silent-skip risk on
  #     the only gate that compiles half the repository is a bad trade at this price.
  #
  # `paths-ignore` at the top of this file still does the large cut (106 of the last 120 commits
  # touch only docs/**, AGENTS.md, CLAUDE.md or README.md), and no third-party action is added.
  #
  # Deliberately NOT changed: this job does not exclude, skip or tolerate any failing test. It
  # compiles; it runs no tests at all, so it cannot mask the two reds that stand at HEAD
  # (CadenceKanbanColumnLifecycleSurfaceTests.aRefusedColumnCompletionIsReportedOnTheColumnOnce-
  # ThePopoverIsGone and CadenceSaveCommitDisciplineTests.noInsertIsLeftPendingWithNoCommit-
  # AnywhereInItsDeclaration). Those belong to `macos-tests`, which is untouched and WILL go red
  # on them the moment the unpushed commits reach origin. No `-skip-testing:` was added for
  # either, on purpose: a named exclusion is how a red becomes permanent furniture.
  # ---------------------------------------------------------------------------
  ios-build:
    name: Build iOS surface
    runs-on: macos-latest
    timeout-minutes: 40
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.run_ios
      || github.event_name == 'push'
      || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Assert toolchain
        run: ./.github/scripts/assert-toolchain.sh
      - name: Build
        run: |
          export TMPDIR="$RUNNER_TEMP/"
          ./scripts/xcb.sh ci-ios build \
            -scheme Cadence \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd-ios" \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_ENTITLEMENTS=.github/ci.entitlements
      - name: Gates
        if: always()
        run: ./.github/scripts/check-log.sh "$RUNNER_TEMP/cadence-xcb-ci-ios.log" build
