# The cheap half of CI. PROPOSAL — see .github/workflows/ci.yml for the rationale and the cost.
#
# This is a separate workflow, not a job in ci.yml, for one reason: ci.yml `paths-ignore`s docs/**
# and **/AGENTS.md, because 106 of the last 120 commits here touch nothing else and macOS runner
# minutes are the expensive resource. That exclusion leaves the guides' own budget unchecked on
# exactly the pushes most likely to break it. This workflow fires on the complement.
#
# `AgentContextBudgetTests` remains the authority; it caps every AGENTS.md in the tree and also
# checks routing and required links, which this does not. What this adds is the FAST red: the test
# only runs inside the ~25-minute macOS job, and two agents in a row have landed a good rule and
# left the file over the cap, turning a green batch into a rerun. Ubuntu minutes bill at 1x.

name: Docs budget

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '**/AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
  pull_request:
    paths:
      - 'docs/**'
      - '**/AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # T-1332. There are TWO budgets here and the job reports both on every guide, passing or failing.
  #
  # The line cap alone measured a proxy the governed thing is free to decouple from. Measured when
  # this was written: `Cadence/Services/AGENTS.md` was 17,958 bytes in 138 lines (130 bytes/line)
  # while root `AGENTS.md` was 12,459 bytes in 199 lines (63 bytes/line) -- 44% more text, 31%
  # further under the cap, and this job called it the comfortable one. Worse, the cap points the
  # wrong way: rewrapping a dense paragraph onto more lines makes a file FAIL a budget it did not
  # get worse against. So do not rewrap to pass either number; move rationale to a linked long
  # reference, which is what T-434 and T-1208 already do.
  #
  # 18,000 bytes is the largest guide in the tree rounded up to the nearest 500 -- a RATCHET, not an
  # allowance. It costs nobody a trim today and stops the biggest file getting bigger. Bytes, not
  # tokens: no tokenizer is chosen here, and `wc -c` is a number any reader can reproduce.
  #
  # `AgentContextBudgetTests` remains the authority; this is the fast red, on Ubuntu minutes, for
  # the docs-only pushes ci.yml excludes. The two carry the same BYTE number and, until [[T-1363]],
  # NOT the same line number: the test counts `split(separator: "\n")`, which is `wc -l` + 1 for a
  # newline-terminated file, and caps that at 200 -- so it permits 199 by `wc -l` while this job
  # permitted 200. A guide at exactly 200 was green here and red there, from one commit. This job
  # now refuses at `-ge 200` so the two agree, and states both counts the way the test's failure
  # message does, because an agent who reads only one of them must not land on the wrong one.
  budget:
    name: Always-read guides stay under 200 lines and 18000 bytes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check line and byte budgets
        run: |
          set -uo pipefail
          rc=0
          count=0
          max_bytes=0
          near=0
          # `-ge 200`, not `-gt`: the cap is 200 by AgentContextBudgetTests' count, which is one
          # MORE than `wc -l` for a newline-terminated file. 199 here is the same file as 200 there.
          while IFS= read -r guide; do
            count=$((count + 1))
            lines=$(wc -l < "$guide" | tr -d ' ')
            bytes=$(wc -c < "$guide" | tr -d ' ')
            [ "$bytes" -le "$max_bytes" ] || max_bytes=$bytes
            printf '  %-40s %4s lines %7s bytes\n' "$guide" "$lines" "$bytes"
            if [ "$lines" -ge 200 ]; then
              echo "::error file=$guide::$guide is $lines lines by wc -l ($((lines + 1)) by AgentContextBudgetTests' count); the cap is 199 by wc -l (200 by that count). It is $bytes bytes of 18000."
              rc=1
            elif [ "$lines" -ge 195 ]; then
              # T-1363's other half. Three of the thirteen guides sat at exactly 199 -- the maximum
              # -- so the next line added to any of them was red by construction, which is how
              # T-1208 and T-1362 both happened. A ceiling files sit flush against is being used
              # as a target. This says so BEFORE the commit that goes over, not after.
              echo "::warning file=$guide::$guide is $lines lines of 199 by wc -l, $((199 - lines)) from the cap. Displace prose to a linked reference now; do not spend the last lines."
              near=$((near + 1))
            fi
            if [ "$bytes" -gt 18000 ]; then
              echo "::error file=$guide::$guide is $bytes bytes, over the 18000-byte cap (and $lines lines of 199 by wc -l)."
              rc=1
            elif [ "$bytes" -ge 17500 ]; then
              echo "::warning file=$guide::$guide is $bytes bytes of 18000, $((18000 - bytes)) from the cap. Displace prose to a linked reference now."
              near=$((near + 1))
            fi
          done < <(git ls-files '*AGENTS.md' 'CLAUDE.md' | sort)
          echo "  checked $count guides; largest is $max_bytes bytes of the 18000-byte budget; $near are within a whisker of a cap."
          # Non-vacuity: a glob that found nothing must not read as a pass. The tree had 13
          # capped guides when this was written; AgentContextBudgetTests asserts >= 12.
          if [ "$count" -lt 12 ]; then
            echo "::error::found only $count guides to cap; the file list is wrong, not the budget."
            rc=1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "A new always-read rule must remove or link out something else in the same change."
            echo "Put the detail in docs/SUBAGENT_RUNBOOK.md or another linked reference."
            echo "Do NOT rewrap prose to pass either budget: it changes the line count without"
            echo "changing what an agent has to read, which is the defect T-1332 was filed about."
          fi
          exit $rc

  # ---------------------------------------------------------------------------
  # T-1298. The ledger's other direction. `agent-commit.sh`'s `LEDGER-ID-UNFILED`
  # means a commit message cannot name an id the ledger has never heard of, so the
  # ledger cannot LOSE an id; nothing asked whether an id a landed commit named is
  # still sitting in the open sections. Three were on 2026-09-19, one of them
  # telling its next reader not to do work that had already shipped.
  #
  # This job and its twin in ci.yml run the same script. The two path filters are
  # set-complements as WRITTEN -- ci.yml `paths-ignore`s exactly what docs.yml
  # `paths` -- so between them the check runs on every push, which is the property
  # that matters. What does NOT follow, and what this comment claimed until
  # [[T-1315]], is that exactly one of them runs: GitHub fires `paths` when ANY
  # changed file matches and skips `paths-ignore` only when ALL of them do, so a
  # push touching `docs/TODO.md` and a `.swift` file satisfies both filters. That
  # is the shape of nearly every commit here (the ledger closure lands with the
  # code), so the ordinary case is BOTH workflows running and `ledger-lag` running
  # twice. The coverage overlaps; it does not partition.
  #
  # Left overlapping on purpose. The two runs read the same commit against the
  # same ledger, so they cannot disagree; the duplicate costs one Ubuntu checkout
  # and a check measured at 0.28 s over 1171 commits, against 1x minutes. Giving
  # the check one owner instead needs either a third workflow with no path filter
  # (a file whose only job is to exist) or a changed-file filter evaluated inside
  # ci.yml so its macOS jobs can still be skipped -- more moving parts in the one
  # place a mistake means the ledger check silently stops running. The only real
  # cost of the overlap is two red emails instead of one.
  #
  # The docs-only half still earns its keep: a ledger edit is the other way this
  # goes wrong, and a correction that reopens an entry whose code has landed is
  # red here and nowhere else.
  #
  # `fetch-depth: 0` is load-bearing, not tidy. The default is a depth-1 checkout,
  # over which this check examines zero commits and exits 0 -- so the script also
  # carries its own floors and refuses that run (LEDGER-LAG-VACUOUS) rather than
  # letting a shallow fetch read as a pass.
  # ---------------------------------------------------------------------------
  ledger-lag:
    name: A landed commit's ticket id is closed in the ledger
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the ledger against the commits that landed
        run: ./scripts/ledger-lag-check.sh
